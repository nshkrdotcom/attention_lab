run:
  name: dynamic_value_query_conditioned_attention_30m_seed2
  out_dir: runs/experiments/E004_operator_binding_qkv_gauntlet/dynamic_value_query_conditioned_attention_30m_seed2
  seed: 1338

data:
  data_root: data/fineweb_edu_100m
  tokenizer: gpt2
  vocab_size: 50304
  train_tokens: 100000000
  val_tokens: 4000000

model:
  attention_type: dynamic_value_query_conditioned_attention
  dynamic_value_gate_bias_init: 0.0
  dynamic_value_gate_from: x
  dynamic_value_pairwise_gate: false
  block_size: 1024
  n_layer: 6
  n_head: 6
  n_embd: 384
  dropout: 0.0
  bias: false

train:
  device: cuda
  dtype: bfloat16
  compile: false
  eval_at_start: true
  B: 4
  T: 1024
  total_batch_size: 262144
  max_steps: 3000
  grad_clip: 1.0
  weight_decay: 0.1
  learning_rate: 0.0006
  min_lr: 0.00006
  warmup_steps: 100
  val_every: 250
  val_steps: 20
  save_every: 1000
  log_every: 10

sample:
  sample_every: 1000
  prompt: "The history of mathematics"
  num_samples: 4
  max_new_tokens: 96
  top_k: 50
  temperature: 1.0
  seed: 42

diagnostics:
  attention_diagnostics_every: 250

queue:
  family: operator_binding_qkv_gauntlet
  hypothesis_doc: docs/experiments/E004_operator_binding_qkv_gauntlet/hypothesis_dynamic_value_query_conditioned_attention_30m_seed2.md
  requires_run: standard_refactor_control_30m_seed2
  full_run_approved: false
  allow_overwrite_existing_run_dir: false
  allow_missing_diagnostics: false
  mechanism_check: dynamic_value_activity
